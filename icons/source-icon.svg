<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2748"/>
      <stop offset="100%" stop-color="#2b3865"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#4a5c9c" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#4a5c9c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="body" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#fff7e2"/>
      <stop offset="46%" stop-color="#ffcf85"/>
      <stop offset="100%" stop-color="#ff8f4d"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="240" r="230" fill="url(#glow)"/>
  <!-- flame crest -->
  <g transform="translate(256,262) scale(1.42) translate(-100,-104)">
    <path d="M100 18 c 20 30 34 34 34 58 0 10-6 18-13 23 6-16-4-27-13-31 3 16-9 22-18 30-8-8-16-16-13-30-9 6-16 16-11 31-8-5-14-13-14-23 0-24 14-28 34-58 z"
          fill="#ffb03a" opacity=".95"/>
  </g>
