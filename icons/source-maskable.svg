    <path d="M198 272 q22 24 44 0" stroke="#4a1c05" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M270 272 q22 24 44 0" stroke="#4a1c05" stroke-width="15" fill="none" stroke-linecap="round"/>
